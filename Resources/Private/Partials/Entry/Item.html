<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:az="http://typo3.org/ns/HauerHeinrich/HhExtAz/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="title">
    <f:switch expression="{entry.recordType}">
        <f:case value="internal">
            <f:if condition="{entry.link}">
                <f:then>
                    <f:link.typolink parameter="{entry.link}" class="entry-link entry-link--internal">
                        <span class="entry-title" data-hhextaz-highlight><az:highlight text="{entry.title}" words="{words}" /></span>
                        <span class="link-hint" aria-hidden="true">
                            <svg class="icon icon-arrow" focusable="false"><use href="{f:uri.resource(path: 'EXT:hh_ext_az/Resources/Public/Icons/icon_sprite.svg')}#icon_arrow"></use></svg>
                        </span>
                    </f:link.typolink>
                </f:then>
                <f:else>
                    <span class="entry-title" data-hhextaz-highlight><az:highlight text="{entry.title}" words="{words}" /></span>
                    <span class="error"><f:translate key="LLL:EXT:hh_ext_az/Resources/Private/Language/locallang.xlf:entry.linkMissing" /></span>
                </f:else>
            </f:if>
        </f:case>

        <f:case value="external">
            <f:if condition="{entry.link}">
                <f:then>
                    <f:link.typolink parameter="{entry.link}" target="_blank" additionalAttributes="{rel: 'noopener noreferrer'}" class="entry-link entry-link--external">
                        <span class="entry-title" data-hhextaz-highlight><az:highlight text="{entry.title}" words="{words}" /></span>
                        <span class="link-hint" aria-hidden="true">
                            <svg class="icon icon-arrow" focusable="false"><use href="{f:uri.resource(path: 'EXT:hh_ext_az/Resources/Public/Icons/icon_sprite.svg')}#icon_arrow"></use></svg>
                        </span>
                        <span class="visually-hidden"> (<f:translate key="LLL:EXT:hh_ext_az/Resources/Private/Language/locallang.xlf:entry.opensInNewTab" />)</span>
                    </f:link.typolink>
                </f:then>
                <f:else>
                    <span class="entry-title" data-hhextaz-highlight><az:highlight text="{entry.title}" words="{words}" /></span>
                    <span class="error"><f:translate key="LLL:EXT:hh_ext_az/Resources/Private/Language/locallang.xlf:entry.linkMissing" /></span>
                </f:else>
            </f:if>
        </f:case>

        <f:case value="file">
            <f:if condition="{entry.link}">
                <f:then>
                    <f:if condition="{entry.forceDownload}">
                        <f:then>
                            <f:link.typolink parameter="{entry.link}" class="entry-link entry-link--file" additionalAttributes="{download: ''}">
                                <span class="entry-title" data-hhextaz-highlight><az:highlight text="{entry.title}" words="{words}" /></span>
                                <span class="link-hint" aria-hidden="true">
                                    <svg class="icon icon-download" focusable="false"><use href="{f:uri.resource(path: 'EXT:hh_ext_az/Resources/Public/Icons/icon_sprite.svg')}#icon_download"></use></svg>
                                </span>
                                <span class="visually-hidden"> (<f:translate key="LLL:EXT:hh_ext_az/Resources/Private/Language/locallang.xlf:entry.download" />)</span>
                            </f:link.typolink>
                        </f:then>
                        <f:else>
                            <f:link.typolink parameter="{entry.link}" class="entry-link entry-link--file">
                                <span class="entry-title" data-hhextaz-highlight><az:highlight text="{entry.title}" words="{words}" /></span>
                                <span class="link-hint" aria-hidden="true">
                                    <svg class="icon icon-arrow" focusable="false"><use href="{f:uri.resource(path: 'EXT:hh_ext_az/Resources/Public/Icons/icon_sprite.svg')}#icon_arrow"></use></svg>
                                </span>
                            </f:link.typolink>
                        </f:else>
                    </f:if>
                </f:then>
                <f:else>
                    <span class="entry-title" data-hhextaz-highlight><az:highlight text="{entry.title}" words="{words}" /></span>
                    <span class="error"><f:translate key="LLL:EXT:hh_ext_az/Resources/Private/Language/locallang.xlf:entry.linkMissing" /></span>
                </f:else>
            </f:if>
        </f:case>

        <f:case value="text">
            <span class="entry-title" data-hhextaz-highlight><az:highlight text="{entry.title}" words="{words}" /></span>
        </f:case>

        <f:defaultCase>
            <f:link.action action="show"
                controller="Entry"
                extensionName="HhExtAz"
                pluginName="List"
                arguments="{entry: entry}"
                class="entry-link entry-link--detail"
            >
                <span class="entry-title" data-hhextaz-highlight><az:highlight text="{entry.title}" words="{words}" /></span>
                <span class="link-hint" aria-hidden="true">
                    <svg class="icon icon-arrow" focusable="false"><use href="{f:uri.resource(path: 'EXT:hh_ext_az/Resources/Public/Icons/icon_sprite.svg')}#icon_arrow"></use></svg>
                </span>
            </f:link.action>
        </f:defaultCase>
    </f:switch>
</div>

<f:if condition="{entry.teaser}">
    <p class="teaser" data-hhextaz-highlight><az:highlight text="{entry.teaser}" words="{words}" /></p>
</f:if>

</html>

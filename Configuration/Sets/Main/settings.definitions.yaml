    type: string
    default: ''

  plugin.tx_hhextaz.view.templateRootPath:
    label: 'Template Root Path (Override)'
    category: hhExtAz
    type: string
    default: ''

  plugin.tx_hhextaz.view.partialRootPath:
    label: 'Partial Root Path (Override)'
    category: hhExtAz
    type: string
    default: ''

  plugin.tx_hhextaz.view.layoutRootPath:
    label: 'Layout Root Path (Override)'
    category: hhExtAz
    type: string
    default: ''

  plugin.tx_hhextaz.settings.includeCss:
    label: 'Include CSS'
    description: ''
    category: hhExtAz
    type: int
    default: 1

  plugin.tx_hhextaz.settings.includeJavaScript:
    label: 'Include JavaScript'
    description: ''
    category: hhExtAz
    type: int
